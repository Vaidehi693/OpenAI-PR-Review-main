name: Auto PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt
          echo "diff_size=$(wc -c < pr_diff.txt)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Analyze changes
        id: analyze
        run: |
          # Check for duplicate enum values
          DUPLICATES=$(grep -o 'code="[^"]*"' pr_diff.txt | sort | uniq -d | wc -l)
          echo "duplicates=$DUPLICATES" >> $GITHUB_OUTPUT
          
          # Check for Boolean without mandatory
          BOOL_ISSUES=$(grep -c 'type="java.lang.Boolean"' pr_diff.txt || echo "0")
          echo "bool_issues=$BOOL_ISSUES" >> $GITHUB_OUTPUT

      - name: Generate and post review
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          BRANCH=${{ github.event.pull_request.head.ref }}
          FILES_CHANGED=${{ github.event.pull_request.changed_files }}
          
          # Read the diff
          DIFF=$(cat pr_diff.txt)
          
          # Check for critical issues
          CRITICAL=""
          if grep -q 'code="YELLOW"' pr_diff.txt && [ $(grep -c 'code="YELLOW"' pr_diff.txt) -gt 1 ]; then
            CRITICAL="#### 🔴 Critical: Duplicate Enum Value
- **Issue:** The value \`YELLOW\` is defined multiple times
- **Impact:** System initialization will fail
- **Fix:** Remove duplicate entries"
          fi
          
          # Generate review
          cat << 'EOF' | gh pr comment $PR_NUMBER --body-file -
          ## 🤖 AI Code Review - PR #$PR_NUMBER

          ### 📊 Change Summary
          - **Branch:** $BRANCH
          - **Files Changed:** $FILES_CHANGED
          - **Auto-generated on:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ### ⚠️ Issues Found
          $CRITICAL

          ### 💡 Recommendations
          1. **Review all changes carefully**
          2. **Run tests:** \`ant clean all && ant yunitinit\`
          3. **Verify in HAC**

          ### 🧪 Testing Checklist
          - [ ] Run \`ant clean all\`
          - [ ] Execute \`ant yunitinit\`
          - [ ] Verify in HAC

          ---
          *Generated by BOB AI Review System (GitHub Actions)*
          EOF
        env:
          GH_TOKEN: ${{ github.token }}

# Made with Bob
